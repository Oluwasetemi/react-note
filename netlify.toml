[build]
publish = "dist"
command = "npm run build"

[build.environment]
NODE_VERSION = "24"

# Required by the StackBlitz WebContainer embed.
[[headers]]
for = "/*"
[headers.values]
Cross-Origin-Opener-Policy = "same-origin"
Cross-Origin-Embedder-Policy = "credentialless"

[[redirects]]
from = "/.well-known/*"
to = "/.well-known/:splat"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
